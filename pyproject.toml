[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "voice-honesty-gate"
version = "0.1.0"
description = "Ports relay-gate's FALSE_COMPLETION_CLAIM check from text coding-agent trajectories to AssemblyAI Voice Agent transcripts."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
vhg = "voice_honesty_gate.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
